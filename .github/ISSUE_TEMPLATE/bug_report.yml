name: Bug report / 问题反馈
description: 使用脱敏的最小复现报告问题；请勿提交安全漏洞或私人数据。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先查看 README 的先决条件与接入边界。
        **不要粘贴 QQ 号、群号、昵称、聊天原文/归档、二维码、密码、token、API key、完整配置、数据库或私人部署地址。**
        日志和截图也必须脱敏；用 `USER_A` / `GROUP_A` 等合成标识替代真实账号信息。
        安全漏洞请遵循 SECURITY.md，不要在公开 issue 中披露利用步骤或敏感数据。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已阅读 README，并确认附件与文字不含账号、密钥、聊天记录或私人部署信息。
          required: true
        - label: 这是普通问题反馈，不是需要私下处理的安全漏洞。
          required: true
  - type: input
    id: version
    attributes:
      label: dsh-qq 版本
      placeholder: "例如：0.2.2"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 仅填版本和接入方式，不要提供真实账号、路径或服务地址。
      placeholder: |
        DSH 版本：
        Node.js / npm 版本：
        操作系统：
        后端名称与版本（如适用）：
        接入模式（native / external / docker）：
        ffmpeg / ffprobe 版本（仅媒体问题）：
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用公开示例、mock 或合成数据；说明已修改的非敏感设置，不要上传完整配置。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏诊断
      description: 可附最小错误片段、测试输出或已脱敏截图；不需要完整日志或数据目录。
    validations:
      required: true
